name: Mettre à jour le flux RSS
 
on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 6h UTC
  workflow_dispatch: {}    # bouton "Run workflow" manuel
 
permissions:
  contents: write
 
jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
 
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Installer les dépendances
        run: pip install -r requirements.txt
 
      - name: Générer le flux RSS
        run: python scraper.py
 
      - name: Publier le flux mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/rss.xml
          git diff --quiet --cached || git commit -m "Mise à jour automatique du flux RSS"
          git push
